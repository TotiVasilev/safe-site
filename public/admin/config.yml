backend:
  name: github
  repo: TotiVasilev/safe-site
  branch: master
  base_url: https://tetraedar-cms-auth.todorvasilev0144.workers.dev
  auth_endpoint: auth
  site_domain: tetraedar.pages.dev

media_folder: public/products/uploads
public_folder: /products/uploads

collections:
  - name: categories
    label: "Категории"
    label_singular: "Категория"
    folder: content/categories
    create: true
    delete: false
    identifier_field: title
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Име на категорията", name: title, widget: string }
      - { label: "Ред на показване", name: order, widget: number, value_type: int, default: 100, min: 0, hint: "По-малко число = по-напред. Например 10, 20, 30." }

  - name: subcategories
    label: "Подкатегории"
    label_singular: "Подкатегория"
    folder: content/subcategories
    create: true
    delete: false
    identifier_field: title
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Име на подкатегорията", name: title, widget: string }
      - label: "Родителска категория"
        name: category
        widget: relation
        collection: categories
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
      - { label: "Ред на показване", name: order, widget: number, value_type: int, default: 100, min: 0 }

  - name: products
    label: "Продукти"
    label_singular: "Продукт"
    folder: content/products
    create: true
    delete: false
    identifier_field: title
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Име на продукта", name: title, widget: string }
      - label: "Категория"
        name: category
        widget: relation
        collection: categories
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
      - label: "Подкатегория (по избор)"
        name: subcategory
        widget: relation
        required: false
        collection: subcategories
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        hint: "Изберете подкатегория от същата категория. Оставете празно, ако няма такава."
      - { label: "Ред на показване", name: order, widget: number, value_type: int, default: 100, min: 0, hint: "По-малко число = по-напред." }
      - { label: "Кратък надпис над името", name: cardLabel, widget: string, required: false }
      - { label: "Описание", name: description, widget: text }
      - { label: "Основна снимка", name: image, widget: image, required: false }
      - label: "Допълнителни снимки (може да ги размествате)"
        name: images
        widget: list
        required: false
        field: { label: "Снимка", name: image, widget: image }
      - label: "Модели и технически характеристики"
        name: models
        widget: list
        required: false
        fields:
          - { label: "Име на модела", name: name, widget: string }
          - { label: "Външни размери", name: dimensions, widget: string, required: false }
          - { label: "Вътрешни размери", name: internalDimensions, widget: string, required: false }
          - { label: "Тегло", name: weight, widget: string, required: false }
          - { label: "Обем", name: volume, widget: string, required: false }
          - { label: "Клас на устойчивост", name: resistance, widget: string, required: false }
