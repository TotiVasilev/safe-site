backend:
  name: github
  repo: TotiVasilev/safe-site
  branch: master
  base_url: https://tetraedar-cms-auth.todorvasilev0144.workers.dev
  auth_endpoint: auth
  site_domain: tetraedar.pages.dev
media_folder: public/products/uploads
public_folder: /products/uploads
collections:
- name: categories
  label: Категории
  label_singular: Категория
  folder: content/categories
  create: true
  delete: false
  identifier_field: title
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: Име на категорията
    name: title
    widget: string
  - label: Ред на показване
    name: order
    widget: number
    value_type: int
    default: 100
    min: 0
    hint: По-малко число = по-напред. Ако два записа имат еднакъв номер, подреждат се по постоянния си идентификатор.
- name: subcategories
  label: Подкатегории
  label_singular: Подкатегория
  folder: content/subcategories
  create: true
  delete: false
  identifier_field: title
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: Име на подкатегорията
    name: title
    widget: string
  - label: Родителска категория
    name: category
    widget: relation
    collection: categories
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
  - label: Ред на показване
    name: order
    widget: number
    value_type: int
    default: 100
    min: 0
- name: products
  label: Продукти
  label_singular: Продукт
  folder: content/products
  create: true
  delete: true
  identifier_field: title
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: Име на продукта
    name: title
    widget: string
  - label: Категория
    name: category
    widget: relation
    collection: categories
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
  - label: Подкатегория (по избор)
    name: subcategory
    widget: relation
    required: false
    collection: subcategories
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    hint: Изберете подкатегория от същата категория. Оставете празно, ако няма такава.
  - label: Ред на показване
    name: order
    widget: number
    value_type: int
    default: 100
    min: 0
    hint: По-малко число означава по-предна позиция. При еднакви числа продуктите се подреждат по идентификатор.
  - label: Кратък надпис над името
    name: cardLabel
    widget: string
    required: false
  - label: Описание
    name: description
    widget: text
  - label: Кликаеми думи и прикачени файлове
    name: attachments
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.phrase}}'
    hint: Добавете дума или точен откъс от описанието и прикачете изображение или PDF. Работи и в каталога, и в страницата на продукта.
    fields:
    - label: Дума или фраза от описанието
      name: phrase
      widget: string
      hint: Напишете точно текста, който трябва да стане кликаем (включително главни/малки букви).
    - label: Изображение или PDF файл
      name: file
      widget: file
      media_folder: /public/products/uploads
      public_folder: /products/uploads
      hint: Изберете или качете PDF или изображение.
  - label: Основна снимка
    name: image
    widget: image
    required: false
  - label: Допълнителни снимки (може да ги размествате)
    name: images
    widget: list
    required: false
    field:
      label: Снимка
      name: image
      widget: image
  - label: Обща техническа схема за моделите (H, B, L)
    name: modelDrawing
    widget: image
    required: false
  - label: Модели и технически характеристики
    name: models
    widget: list
    required: false
    fields:
    - label: Име на модела
      name: name
      widget: string
    - label: Външна височина (H), мм
      name: height
      widget: string
      required: false
    - label: Външна ширина (B), мм
      name: width
      widget: string
      required: false
    - label: Външна дълбочина (L), мм
      name: depth
      widget: string
      required: false
    - label: Вътрешна височина (H₁), мм
      name: innerHeight
      widget: string
      required: false
    - label: Вътрешна ширина (B₁), мм
      name: innerWidth
      widget: string
      required: false
    - label: Вътрешна дълбочина (L₁), мм
      name: innerDepth
      widget: string
      required: false
    - label: Тегло
      name: weight
      widget: string
      required: false
    - label: Обем
      name: volume
      widget: string
      required: false
    - label: Клас на устойчивост
      name: resistance
      widget: string
      required: false
- name: website
  label: Съдържание на сайта
  files:
  - name: services
    label: Услуги и сервиз
    file: content/services.json
    format: json
    fields:
    - label: Услуга 1 - Заглавие
      name: title1
      widget: string
      required: true
    - label: Услуга 1 - Описание
      name: description1
      widget: text
      required: true
    - label: Услуга 2 - Заглавие
      name: title2
      widget: string
      required: true
    - label: Услуга 2 - Описание
      name: description2
      widget: text
      required: true
    - label: Услуга 3 - Заглавие
      name: title3
      widget: string
      required: true
    - label: Услуга 3 - Описание
      name: description3
      widget: text
      required: true
    - label: Услуга 4 - Заглавие
      name: title4
      widget: string
      required: true
    - label: Услуга 4 - Описание
      name: description4
      widget: text
      required: true
    - label: Услуга 5 - Заглавие
      name: title5
      widget: string
      required: true
    - label: Услуга 5 - Описание
      name: description5
      widget: text
      required: true
    - label: Услуга 6 - Заглавие
      name: title6
      widget: string
      required: true
    - label: Услуга 6 - Описание
      name: description6
      widget: text
      required: true
  - name: homepage
    label: Начална страница
    file: content/homepage.json
    format: json
    fields:
    - label: Начален екран - Заглавие (нов ред = нов ред в заглавието)
      name: heroTitle
      widget: text
      required: true
    - label: Описание
      name: heroDescription
      widget: text
      required: true
    - label: Фонова снимка
      name: heroBackground
      widget: image
      required: false
    - label: Текст на бутон Продукти
      name: primaryButton
      widget: string
      required: true
    - label: Адрес на бутон Продукти
      name: primaryLink
      widget: string
      required: true
      hint: Например /produkti или /uslugi
    - label: Текст на бутон Услуги
      name: secondaryButton
      widget: string
      required: true
    - label: Адрес на бутон Услуги
      name: secondaryLink
      widget: string
      required: true
      hint: Например /produkti или /uslugi
    - label: За нас - Надпис
      name: aboutLabel
      widget: string
      required: true
    - label: Заглавие
      name: aboutTitle
      widget: string
      required: true
    - label: Първи абзац
      name: aboutParagraph1
      widget: text
      required: true
    - label: Втори абзац
      name: aboutParagraph2
      widget: text
      required: true
    - label: Предимство 1
      name: feature1Title
      widget: string
      required: true
    - label: Описание 1
      name: feature1Description
      widget: text
      required: true
    - label: Предимство 2
      name: feature2Title
      widget: string
      required: true
    - label: Описание 2
      name: feature2Description
      widget: text
      required: true
    - label: Предимство 3
      name: feature3Title
      widget: string
      required: true
    - label: Описание 3
      name: feature3Description
      widget: text
      required: true
    - label: Доверени партньори - Надпис
      name: partnersLabel
      widget: string
      required: true
    - label: Заглавие
      name: partnersTitle
      widget: string
      required: true
    - label: Описание
      name: partnersDescription
      widget: text
      required: true
    - label: Продукти на началната страница - Надпис
      name: productsLabel
      widget: string
      required: true
    - label: Заглавие
      name: productsTitle
      widget: string
      required: true
    - label: Описание
      name: productsDescription
      widget: text
      required: true
    - label: Заглавие на представения продукт
      name: featuredTitle
      widget: string
      required: true
    - label: Описание на представения продукт
      name: featuredDescription
      widget: text
      required: true
    - label: Текст на бутон Каталог
      name: catalogButton
      widget: string
      required: true
    - label: Надпис над каталога
      name: catalogLabel
      widget: string
      required: true
    - label: Заглавие на каталога
      name: catalogTitle
      widget: string
      required: true
    - label: Описание на каталога
      name: catalogDescription
      widget: text
      required: true
    - label: Услуги на началната страница - Надпис
      name: servicesLabel
      widget: string
      required: true
    - label: Заглавие
      name: servicesTitle
      widget: string
      required: true
    - label: Описание
      name: servicesDescription
      widget: text
      required: true
    - label: Текст на бутон Услуги
      name: servicesButton
      widget: string
      required: true
    - label: Запитване - Надпис
      name: contactLabel
      widget: string
      required: true
    - label: Заглавие
      name: contactTitle
      widget: string
      required: true
    - label: Описание
      name: contactDescription
      widget: text
      required: true
    - label: Текст на бутон Запитване
      name: contactButton
      widget: string
      required: true
    - label: Адрес на бутон Запитване
      name: contactLink
      widget: string
      required: true
      hint: Например /produkti или /uslugi
    - label: Лога на партньорите (може да ги размествате)
      name: partners
      widget: list
      required: false
      summary: '{{fields.name}}'
      fields:
      - label: Име
        name: name
        widget: string
      - label: Лого (ако е празно, показва името)
        name: image
        widget: image
        required: false
      - label: Сайт (по избор)
        name: url
        widget: string
        required: false
