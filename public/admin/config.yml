      widget: text
      required: true
    - label: "Шрифт — heroTitle"
      name: heroTitleStyle
      widget: object
      required: false
      collapsed: false
      fields:
      - {label: Размер на компютър (px), name: desktop, widget: number, required: false, value_type: int, min: 8, max: 120}
      - {label: Размер на телефон (px), name: mobile, widget: number, required: false, value_type: int, min: 8, max: 80}
