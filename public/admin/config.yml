backend:
  name: github
  repo: TotiVasilev/safe-site
  branch: master
  base_url: https://tetraedar-cms-auth.todorvasilev0144.workers.dev
  auth_endpoint: auth
  site_domain: tetraedar.pages.dev

media_folder: public/products/uploads
public_folder: /products/uploads

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: content/products
    create: false
    delete: false
    extension: md
    format: frontmatter

    fields:
      - label: Product name
        name: title
        widget: string

      - label: Product slug
        name: slug
        widget: string
        hint: "Do not change this. It connects the editor to the website."

      - label: Card label
        name: cardLabel
        widget: string
        required: false
        hint: "Optional short text shown above the product name on the catalog card. Leave empty to hide it."

      - label: Description
        name: description
        widget: text

      - label: Main image
        name: image
        widget: image
        required: false
        hint: "The main image shown on the product card and product page."

      - label: Gallery images
        name: images
        widget: list
        required: false
        hint: "Optional extra images. On desktop, the product card cycles through them while hovered."
        field:
          label: Image
          name: image
          widget: image

      - label: Models
        name: models
        widget: list
        required: false
        fields:
          - label: Model name
            name: name
            widget: string

          - label: External dimensions
            name: dimensions
            widget: string
            required: false

          - label: Internal dimensions
            name: internalDimensions
            widget: string
            required: false

          - label: Weight
            name: weight
            widget: string
            required: false

          - label: Volume
            name: volume
            widget: string
            required: false

          - label: Resistance class
            name: resistance
            widget: string
            required: false
