backend:
  name: github
  repo: TotiVasilev/safe-site
  branch: master
  base_url: https://tetraedar-cms-auth.todorvasilev0144.workers.dev
  auth_endpoint: auth
  site_domain: tetraedar.pages.dev
media_folder: public/products/uploads
public_folder: /products/uploads
collections:
- name: categories
  label: Категории
  label_singular: Категория
  folder: content/categories
  create: true
  delete: false
  identifier_field: title
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: Име на категорията
    name: title
    widget: string
  - label: Ред на показване
    name: order
    widget: number
    value_type: int
    default: 100
    min: 0
    hint: По-малко число = по-напред. Ако два записа имат еднакъв номер, подреждат се по постоянния си идентификатор.
- name: subcategories
  label: Подкатегории
  label_singular: Подкатегория
  folder: content/subcategories
  create: true
  delete: false
  identifier_field: title
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: Име на подкатегорията
    name: title
    widget: string
  - label: Родителска категория
    name: category
    widget: relation
    collection: categories
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
  - label: Ред на показване
    name: order
    widget: number
    value_type: int
    default: 100
    min: 0
- name: products
  label: Продукти
  label_singular: Продукт
  folder: content/products
  create: true
  delete: true
  identifier_field: title
  slug: '{{slug}}'
  extension: md
  format: frontmatter
  fields:
  - label: Име на продукта
    name: title
    widget: string
  - label: Категория
    name: category
    widget: relation
    collection: categories
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
  - label: Подкатегория (по избор)
    name: subcategory
    widget: relation
    required: false
    collection: subcategories
    search_fields:
    - title
    value_field: '{{slug}}'
    display_fields:
    - title
    hint: Изберете подкатегория от същата категория. Оставете празно, ако няма такава.
  - label: Ред на показване
    name: order
    widget: number
    value_type: int
    default: 100
    min: 0
    hint: По-малко число означава по-предна позиция. При еднакви числа продуктите се подреждат по идентификатор.
  - label: Кратък надпис над името
    name: cardLabel
    widget: string
    required: false
  - label: Кратко описание за каталога
    name: catalogDescription
    widget: text
    required: false
    hint: Показва се в малките продуктови карти. Ако е празно, използва се основното описание.
  - label: Подробно описание за страницата на продукта
    name: description
    widget: text
  - label: Специална страница с карти за ключалки
    name: lockCollection
    widget: boolean
    required: false
    default: false
    hint: Само за продукт в категория Ключалки. Отваря страница с некликаеми карти вместо стандартния изглед.
  - label: Ключалки в специалната страница
    name: lockItems
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.name}}'
    fields:
    - {label: Име, name: name, widget: string}
    - {label: Надпис над името, name: cardLabel, widget: string, required: false}
    - {label: Кратко описание, name: description, widget: text, required: false}
    - {label: Снимка, name: image, widget: image, required: false}
  - label: Кликаеми думи и прикачени файлове
    name: attachments
    widget: list
    required: false
    collapsed: true
    summary: '{{fields.phrase}}'
    hint: Една обща настройка за двете описания. Думата става кликаема само там, където присъства, и може да добавяте много различни фрази и файлове.
    fields:
    - label: Дума или фраза от описанието
      name: phrase
      widget: string
      hint: Напишете точно текста, който трябва да стане кликаем (включително главни/малки букви).
    - label: Изображение или PDF файл
      name: file
      widget: file
      media_folder: /public/products/uploads
      public_folder: /products/uploads
      hint: Изберете или качете PDF или изображение.
  - label: Основна снимка
    name: image
    widget: image
    required: false
  - label: Допълнителни снимки (може да ги размествате)
    name: images
    widget: list
    required: false
    field:
      label: Снимка
      name: image
      widget: image
  - label: Обща техническа схема за моделите (H, B, L)
    name: modelDrawing
    widget: image
    required: false
  - label: Модели и технически характеристики
    name: models
    widget: list
    required: false
    fields:
    - label: Име на модела
      name: name
      widget: string
    - label: Външна височина (H), мм
      name: height
      widget: string
      required: false
    - label: Външна ширина (B), мм
      name: width
      widget: string
      required: false
    - label: Външна дълбочина (L), мм
      name: depth
      widget: string
      required: false
    - label: Вътрешна височина (H₁), мм
      name: innerHeight
      widget: string
      required: false
    - label: Вътрешна ширина (B₁), мм
      name: innerWidth
      widget: string
      required: false
    - label: Вътрешна дълбочина (L₁), мм
      name: innerDepth
      widget: string
      required: false
    - label: Тегло
      name: weight
      widget: string
      required: false
    - label: Обем
      name: volume
      widget: string
      required: false
    - label: Клас на устойчивост
      name: resistance
      widget: string
      required: false
